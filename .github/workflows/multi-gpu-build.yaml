
name: Build llama.cpp - CUDA + Vulkan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux x64 - CUDA 12.8 + Vulkan
    runs-on: ubuntu-24.04

    container:
      image: nvidia/cuda:12.8.2-devel-ubuntu24.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: |
          apt-get update

          apt-get install -y --no-install-recommends \
            git \
            build-essential \
            cmake \
            ninja-build \
            libssl-dev \
            jq \
            python3-venv \
            glslc \
            libvulkan-dev \
            spirv-headers \
            mesa-vulkan-drivers

      - name: Checkout llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: master
          fetch-depth: 0

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify toolchain
        run: |
          nvcc --version
          cmake --version
          ninja --version
          glslc --version

      - name: Configure CUDA + Vulkan
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_NCCL=OFF \
            -DGGML_CUDA_CCCL_VERSION=v3.4.3 \
            -DGGML_VULKAN=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DGGML_RPC=ON \
            -DLLAMA_CONNECT=ON

      - name: Compile
        run: |
          cmake --build build \
            --config Release \
            --parallel 2

      - name: Verify backend libraries
        run: |
          echo "Checking CUDA backend"
          find build/bin -maxdepth 1 -name '*cuda*' -type f

          echo "Checking Vulkan backend"
          find build/bin -maxdepth 1 -name '*vulkan*' -type f

          test -n "$(find build/bin -maxdepth 1 \
            -name 'libggml-cuda.so*' -print -quit)"

          test -n "$(find build/bin -maxdepth 1 \
            -name 'libggml-vulkan.so*' -print -quit)"

      - name: Verify server executable
        run: |
          test -x build/bin/llama-server
          build/bin/llama-server --version

      - name: Package llama.cpp
        run: |
          mkdir -p package

          cp -a build/bin/. package/
          cp LICENSE package/

          tar -czf llama-cuda-vulkan-linux-x64.tar.gz \
            -C package .

          sha256sum llama-cuda-vulkan-linux-x64.tar.gz

      - name: Package CUDA runtime libraries
        run: |
          mkdir -p cudart

          cp -L /usr/local/cuda/lib64/libcudart.so.12 cudart/
          cp -L /usr/local/cuda/lib64/libcublas.so.12 cudart/
          cp -L /usr/local/cuda/lib64/libcublasLt.so.12 cudart/

          tar -czf llama-cuda-runtime-12.tar.gz \
            -C cudart .

      - name: Upload llama.cpp artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-vulkan-linux-x64
          path: llama-cuda-vulkan-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload CUDA runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-runtime-12
          path: llama-cuda-runtime-12.tar.gz
          if-no-files-found: error
          retention-days: 7
